<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>위드프레쉬 발주달력</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<!-- 엑셀 다운로드용 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root{
    --navy:#0F2A3F;
    --deep-teal:#0B4F5C;
    --sea:#1B7A8C;
    --foam:#EAF4F3;
    --paper:#FBFAF6;
    --coral:#E8734A;
    --ink:#122023;
    --line:#D8E3E1;

    --c-coupang:#2563EB;
    --c-mega:#16A34A;
    --c-ns:#D97706;
    --c-naver:#65A30D;
    --c-ck:#0891B2;
    --c-lotte:#DC2626;
    --c-seopung:#7C3AED;
    --c-maeip:#57606B;
    --c-oasis:#DB2777;
    --c-etc:#475569;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }

  /* ---------- Header ---------- */
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:18px 16px 22px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{
    font-size:15px;
    letter-spacing:.14em;
    opacity:.65;
    font-weight:600;
    text-transform:uppercase;
  }
  .month-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:6px;
  }
  .month-title{
    font-size:30px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .month-nav{
    display:flex;
    gap:8px;
  }
  .navbtn{
    width:48px;height:48px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.06);
    color:#fff;
    font-size:24px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    user-select:none;
  }
  .navbtn:active{background:rgba(255,255,255,.18);}
  .today-btn{
    margin-top:12px;
    display:inline-block;
    font-size:15px;
    padding:9px 16px;
    border-radius:999px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    cursor:pointer;
  }
  .header-btn-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .excel-btn{
    margin-top:12px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:15px;
    padding:9px 16px;
    border-radius:999px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    cursor:pointer;
  }

  /* ---------- Legend ---------- */
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px 16px;
    padding:14px 16px;
    background:var(--foam);
    border-bottom:1px solid var(--line);
    font-size:14.5px;
  }
  .legend-item{display:flex;align-items:center;gap:7px;color:var(--deep-teal);font-weight:700;}
  .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}

  /* ---------- Calendar grid ---------- */
  .cal-wrap{padding:6px 12px 100px;}

  .day-row{
    display:flex;
    align-items:flex-start;
    gap:16px;
    padding:18px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .day-row:active{background:var(--foam);}
  .day-row.today .date-badge{
    background:var(--coral);
    color:#fff;
  }
  .day-row.today .wd{color:var(--coral);}

  .date-badge-wrap{
    width:62px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:2px;
  }
  .wd{
    font-size:14px;
    font-weight:700;
    color:#8a9695;
    margin-bottom:5px;
  }
  .day-row.sun .wd{color:#C0453A;}
  .day-row.sat .wd{color:var(--sea);}
  .date-badge{
    width:42px;height:42px;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
    font-weight:800;
    color:#2b3a3a;
    background:var(--foam);
  }
  .day-row.sun .date-badge{color:#C0453A;}
  .day-row.sat .date-badge{color:var(--sea);}
  .month-mark{
    font-size:12px;
    font-weight:800;
    color:var(--coral);
    margin-top:4px;
  }

  .day-content{
    flex:1;
    min-width:0;
    padding-top:2px;
  }
  .day-tags{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .row-tag{
    font-size:16px;
    font-weight:800;
    color:#fff;
    padding:9px 12px;
    border-radius:10px;
    white-space:normal;
    line-height:1.5;
  }
  .row-tag .items-preview{
    display:block;
    font-weight:600;
    font-size:15px;
    opacity:.95;
    margin-top:3px;
    white-space:pre-line;
  }
  .row-tag.st-done{opacity:.55;}
  .row-tag.st-sales{opacity:.45;}
  .st-badge{
    display:inline-block;
    font-size:12.5px;
    font-weight:800;
    padding:2px 9px;
    border-radius:999px;
    margin-left:6px;
    vertical-align:1px;
    background:rgba(255,255,255,.95);
    color:var(--navy);
  }
  .arr-note{font-size:13px;font-weight:700;opacity:.9;margin-left:6px;}
  .ship-btn{
    width:100%;
    margin-top:12px;
    padding:14px;
    border-radius:12px;
    border:none;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    background:#16A34A;
    color:#fff;
  }
  .ship-btn.undo{background:#fff;color:#16A34A;border:1.5px solid #16A34A;}
  .ship-info{font-size:13.5px;color:#16A34A;font-weight:700;margin-top:8px;}
  .po-note{font-size:13.5px;color:#8a6100;background:#FFF6DC;border-radius:10px;padding:10px 12px;margin-top:8px;line-height:1.55;}
  .legend-item{cursor:pointer;padding:3px 8px;border-radius:999px;border:1.5px solid transparent;}
  .legend-item.off{opacity:.35;}
  .legend-item.only{border-color:var(--deep-teal);background:#fff;}
  .legend-hint{font-size:12.5px;color:#7b8a89;width:100%;margin-top:-4px;}
  .field input[type="date"].opt{border-style:dashed;}
  .day-empty-mark{
    color:#c3cdcc;
    font-size:16px;
    padding-top:8px;
  }

  .month-section{
    margin-top:18px;
  }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;
    right:20px;
    bottom:24px;
    width:66px;height:66px;
    border-radius:50%;
    background:var(--coral);
    color:#fff;
    font-size:34px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(232,115,74,.45);
    cursor:pointer;
    z-index:30;
    border:none;
  }
  .fab:active{transform:scale(.94);}

  /* ---------- Sheet / Modal ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(10,20,22,.45);
    z-index:40;
    display:none;
  }
  .overlay.show{display:block;}
  .sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    background:#fff;
    border-radius:22px 22px 0 0;
    z-index:50;
    max-height:88vh;
    overflow-y:auto;
    transform:translateY(100%);
    transition:transform .25s ease;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{
    width:40px;height:4px;
    background:#DDE5E4;
    border-radius:99px;
    margin:10px auto 4px;
  }
  .sheet-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 18px 14px;
    border-bottom:1px solid var(--line);
  }
  .sheet-date{font-size:21px;font-weight:800;color:var(--navy);}
  .sheet-close{
    width:38px;height:38px;
    border-radius:50%;
    background:var(--foam);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    color:#5b6b6a;
    cursor:pointer;
    border:none;
  }
  .sheet-body{padding:16px 18px 28px;}

  .order-card{
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:12px;
  }
  .order-card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .chip{
    font-size:14px;
    font-weight:800;
    color:#fff;
    padding:5px 12px;
    border-radius:999px;
  }
  .order-actions{display:flex;gap:8px;}
  .icon-btn{
    width:36px;height:36px;
    border-radius:9px;
    border:none;
    background:var(--foam);
    color:#5b6b6a;
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .rt{white-space:normal;word-break:keep-all;}
  /* 바코드 끝 4자리 형광 표시 */
  .bc-hl{background:#fde047;color:#111;font-weight:800;padding:0 4px;border-radius:4px;}
  .rt div,.rt p{margin:0;}
  .rt-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .rt-group{display:flex;gap:4px;align-items:center;background:#f1f5f4;border-radius:12px;padding:4px;}
  .rt-btn{min-width:44px;height:44px;border:1px solid #cfd8d7;background:#fff;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;padding:0 8px;font-family:inherit;color:#222;}
  .rt-btn:active{background:#dff3ef;}
  .rt-sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #aab6b5;cursor:pointer;padding:0;}
  .rt-glabel{font-size:12px;color:#5b6b6a;font-weight:700;margin:0 2px 0 4px;}
  #fEditor{min-height:52vh;resize:vertical;overflow:auto;border:1.5px solid #cfd8d7;border-radius:12px;padding:12px;font-size:17px;line-height:1.6;background:#fff;color:#111;outline:none;font-family:inherit;}
  #fEditor:focus{border-color:#0f766e;}
  #fEditor:empty:before{content:attr(data-ph);color:#9aa8a7;}
  #formSheet{height:96vh;max-height:96vh;max-width:1100px;margin:0 auto;}
  #daySheet,#excelSheet{max-width:1100px;margin:0 auto;}
  @media (min-width:900px){#fEditor{font-size:19px;min-height:58vh;}}
  .items-list{
    font-size:17px;
    line-height:1.75;
    color:var(--ink);
    white-space:pre-wrap;
    word-break:keep-all;
  }
  .writer-tag{
    font-size:13px;
    color:#8a9695;
    margin-top:8px;
    font-weight:600;
  }
  .empty-day{
    text-align:center;
    color:#9aa6a5;
    font-size:16px;
    padding:30px 0 10px;
  }
  .add-here-btn{
    width:100%;
    margin-top:6px;
    padding:16px;
    border-radius:14px;
    border:1.5px dashed var(--sea);
    background:var(--foam);
    color:var(--deep-teal);
    font-weight:800;
    font-size:16px;
    cursor:pointer;
  }

  /* ---------- Form ---------- */
  .field{margin-bottom:18px;}
  .field label{
    display:block;
    font-size:15px;
    font-weight:800;
    color:var(--deep-teal);
    margin-bottom:8px;
  }
  .field input[type="date"],
  .field select,
  .field textarea{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:15px 15px;
    font-size:17px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
  }
  .field textarea{
    min-height:150px;
    resize:vertical;
    line-height:1.65;
  }
  .field .hint{
    font-size:13.5px;
    color:#9aa6a5;
    margin-top:7px;
  }
  .channel-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
  }
  .channel-opt{
    padding:13px 4px;
    border-radius:12px;
    border:1.5px solid var(--line);
    text-align:center;
    font-size:14px;
    font-weight:700;
    color:#5b6b6a;
    cursor:pointer;
  }
  .channel-opt.selected{
    color:#fff;
    border-color:transparent;
  }
  .save-btn{
    width:100%;
    padding:18px;
    border-radius:14px;
    border:none;
    background:var(--navy);
    color:#fff;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
    margin-top:6px;
  }
  .save-btn:active{opacity:.85;}
  .delete-confirm-btn{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:1.5px solid #E5453A;
    background:#fff;
    color:#E5453A;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    margin-top:8px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:100px;
    transform:translateX(-50%);
    background:var(--navy);
    color:#fff;
    padding:14px 22px;
    border-radius:999px;
    font-size:15px;
    font-weight:700;
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .conn-status{
    position:fixed;
    top:10px;right:12px;
    font-size:10.5px;
    color:rgba(255,255,255,.55);
    z-index:25;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="conn-status" id="connStatus">연결 중…</div>
  <div class="brand">위드프레쉬 발주관리</div>
  <div class="month-row">
    <div class="month-title" id="monthTitle">2026년 8월</div>
    <div class="month-nav">
      <button class="navbtn" id="prevBtn">‹</button>
      <button class="navbtn" id="nextBtn">›</button>
    </div>
  </div>
  <div class="header-btn-row">
    <div class="today-btn" id="todayBtn">오늘로 이동</div>
    <div class="excel-btn" id="excelBtn">⬇ 엑셀 다운로드</div>
  </div>
</div>

<div class="legend" id="legend"></div>

<div class="cal-wrap">
  <div class="grid" id="grid"></div>
</div>

<button class="fab" id="fabBtn">＋</button>

<div class="overlay" id="overlay"></div>

<!-- Day detail sheet -->
<div class="sheet" id="daySheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-date" id="sheetDate">8월 19일 (수)</div>
    <button class="sheet-close" id="daySheetClose">✕</button>
  </div>
  <div class="sheet-body" id="dayBody"></div>
</div>

<!-- Add/Edit form sheet -->
<div class="sheet" id="formSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-date" id="formTitle">발주 추가</div>
    <button class="sheet-close" id="formSheetClose">✕</button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label>출고일</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label>입고(납품)일 <span style="font-weight:600;color:#9aa6a5">— 선택</span></label>
      <input type="date" id="fArrival" class="opt">
      <div class="hint">거래처 도착일이 출고일과 다를 때만 넣으세요. 쿠팡 외 채널은 판매입력이 이 날짜 기준입니다.</div>
    </div>
    <div class="po-note" id="poNote" style="display:none">
      쿠팡 PO로 자동 등록된 건입니다. 품목·수량은 쿠팡도구에서 PO 파일을 다시 올려야 바뀝니다.
      여기서는 <b>출고일·입고일</b>만 고칠 수 있습니다.
    </div>
    <div class="field">
      <label>채널</label>
      <div class="channel-grid" id="channelGrid"></div>
    </div>
    <div class="field">
      <label>품목 / 수량</label>
      <div class="rt-toolbar" id="rtToolbar">
        <div class="rt-group"><button type="button" class="rt-btn" data-cmd="bold"><b>B 굵게</b></button></div>
        <div class="rt-group"><span class="rt-glabel">크기</span>
          <button type="button" class="rt-btn" data-size="0.85em" style="font-size:13px">작게</button>
          <button type="button" class="rt-btn" data-size="1em">보통</button>
          <button type="button" class="rt-btn" data-size="1.3em" style="font-size:19px">크게</button>
          <button type="button" class="rt-btn" data-size="1.7em" style="font-size:23px">특대</button></div>
        <div class="rt-group"><span class="rt-glabel">글자색</span>
          <button type="button" class="rt-sw" data-color="#dc2626" style="background:#dc2626"></button>
          <button type="button" class="rt-sw" data-color="#1d4ed8" style="background:#1d4ed8"></button>
          <button type="button" class="rt-sw" data-color="#15803d" style="background:#15803d"></button>
          <button type="button" class="rt-sw" data-color="#111111" style="background:#111"></button>
          <button type="button" class="rt-sw" data-color="#ffffff" style="background:#fff"></button></div>
        <div class="rt-group"><span class="rt-glabel">형광펜</span>
          <button type="button" class="rt-sw" data-hl="#fde047" style="background:#fde047"></button>
          <button type="button" class="rt-sw" data-hl="#86efac" style="background:#86efac"></button>
          <button type="button" class="rt-sw" data-hl="#fca5a5" style="background:#fca5a5"></button>
          <button type="button" class="rt-btn" data-hl="transparent" style="min-width:36px;height:34px;font-size:13px">없음</button></div>
        <div class="rt-group"><button type="button" class="rt-btn" data-cmd="removeFormat" style="font-size:14px">서식 지우기</button></div>
      </div>
      <div id="fEditor" contenteditable="true" data-ph="한 줄에 한 품목씩 입력&#10;글자를 드래그해서 선택한 뒤 위 버튼을 누르세요"></div>
      <div class="hint">강조할 글자를 길게 눌러 선택한 뒤 굵게·크기·색·형광펜을 누르세요.</div>
    </div>
    <button class="save-btn" id="saveBtn">저장</button>
    <button class="delete-confirm-btn" id="deleteBtn" style="display:none;">이 발주 삭제</button>
  </div>
</div>

<!-- Excel 다운로드 기간 선택 sheet -->
<div class="sheet" id="excelSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-date">엑셀 다운로드</div>
    <button class="sheet-close" id="excelSheetClose">✕</button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label>시작일</label>
      <input type="date" id="excelStart">
    </div>
    <div class="field">
      <label>종료일</label>
      <input type="date" id="excelEnd">
    </div>
    <button class="save-btn" id="excelConfirmBtn">⬇ 다운로드</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1) Firebase 설정
   -- 아래 firebaseConfig 값을 본인 Firebase 프로젝트 값으로 교체하세요.
   -- Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱 > SDK 설정에서 확인 가능
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDInKlXJ10atBW4mEKbELG-eyDegLLhpjs",
  authDomain: "withfresh-order.firebaseapp.com",
  projectId: "withfresh-order",
  storageBucket: "withfresh-order.firebasestorage.app",
  messagingSenderId: "1081597023101",
  appId: "1:1081597023101:web:0ff74d1e32b165e1183214"
};

const DEMO_MODE = firebaseConfig.apiKey === "YOUR_API_KEY";
let db = null;
if(!DEMO_MODE){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}
const COLLECTION = "orders";

   6) Firestore 실시간 구독
========================================================= */
function subscribeOrders(){
  if(DEMO_MODE){
    ordersByDate = {};
    DEMO_DATA.forEach(d=>{
      if(!ordersByDate[d.date]) ordersByDate[d.date] = [];
      ordersByDate[d.date].push(d);
    });
    document.getElementById("connStatus").textContent = "데모 모드 (Firebase 미설정)";
    renderCalendar();
    return;
  }
  db.collection(COLLECTION).orderBy("date").onSnapshot(snap=>{
    ordersByDate = {};
    snap.forEach(doc=>{
      const d = doc.data();
      const key = d.date;
      if(!ordersByDate[key]) ordersByDate[key] = [];
      ordersByDate[key].push({ id: doc.id, ...d });
    });
    document.getElementById("connStatus").textContent = "실시간 연결됨";
    renderCalendar();
    // 열려 있는 날짜 창도 새 내용으로 갱신 (출고완료 표시 즉시 반영)
    if(activeDateStr && document.getElementById("daySheet").classList.contains("show")) openDaySheet(activeDateStr);
  }, err=>{
    document.getElementById("connStatus").textContent = "연결 실패 (설정 확인)";
    console.error(err);
  });
}

/* =========================================================
   7) 캘린더 렌더 (세로 리스트형, 어제부터 앞으로 15일)
========================================================= */
const RANGE_START_OFFSET = -1;  // 어제부터
const RANGE_END_OFFSET = 13;    // 앞으로 13일 더 (총 15일)

function renderCalendar(){
  const weekdayNames = ["일","월","화","수","목","금","토"];
  const start = addDays(centerDate, RANGE_START_OFFSET);
  const end = addDays(centerDate, RANGE_END_OFFSET);

  const startLabel = `${start.getMonth()+1}월 ${start.getDate()}일`;
  const endLabel = `${end.getMonth()+1}월 ${end.getDate()}일`;
  document.getElementById("monthTitle").textContent = `${startLabel} – ${endLabel}`;

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  for(let offset=RANGE_START_OFFSET; offset<=RANGE_END_OFFSET; offset++){
    const dateObj = addDays(centerDate, offset);
    const dateStr = toDateStr(dateObj);
    const dow = dateObj.getDay();
    const day = dateObj.getDate();
    const month = dateObj.getMonth()+1;

    const row = document.createElement("div");
    row.className = "day-row" + (dow===0?" sun":"") + (dow===6?" sat":"") + (dateStr===todayStr?" today":"");
    row.dataset.date = dateStr;

    const dayEntries = (ordersByDate[dateStr] || []).filter(o=> !onlyChannel || o.channel===onlyChannel);

    let contentHtml;
    if(dayEntries.length===0){
      contentHtml = `<div class="day-empty-mark">—</div>`;
    } else {
      contentHtml = `<div class="day-tags">` + dayEntries.map(o=>{
        const ch = channelMap[o.channel] || channelMap.etc;
        const st = statusOf(o);
        const cls = st==="출고완료" ? " st-done" : st==="판매입력완료" ? " st-sales" : "";
        const badge = st==="출고완료" ? `<span class="st-badge">✓ 출고완료</span>`
                    : st==="판매입력완료" ? `<span class="st-badge">✓ 판매입력</span>` : "";
        const arr = (o.arrivalDate && o.arrivalDate!==o.date) ? `<span class="arr-note">→ ${shortDate(o.arrivalDate)} 입고</span>` : "";
        return `<div class="row-tag${cls}" style="background:${ch.color}">${escapeHtml(labelOf(o))}${arr}${badge}
          <span class="items-preview">${renderItems(o.items)}</span>
        </div>`;
      }).join("") + `</div>`;
    }

    // 월이 바뀌는 지점(1일)이거나 리스트 첫 줄이면 "8월 19일"처럼 월 표기
    const showMonth = (day===1) || (offset===RANGE_START_OFFSET);

    row.innerHTML = `
      <div class="date-badge-wrap">
        <div class="wd">${weekdayNames[dow]}</div>
        <div class="date-badge">${day}</div>
        ${showMonth ? `<div class="month-mark">${month}월</div>` : ""}
      </div>
      <div class="day-content">${contentHtml}</div>
    `;
    row.addEventListener("click", ()=> openDaySheet(dateStr));
    grid.appendChild(row);
  }
}

function openDaySheet(dateStr){
  activeDateStr = dateStr;
  const d = new Date(dateStr);
  const wd = ["일","월","화","수","목","금","토"][d.getDay()];
  document.getElementById("sheetDate").textContent = `${d.getMonth()+1}월 ${d.getDate()}일 (${wd})`;

  const entries = ordersByDate[dateStr] || [];
  const body = document.getElementById("dayBody");

  if(entries.length===0){
    body.innerHTML = `<div class="empty-day">등록된 발주가 없습니다</div>`;
  } else {
    body.innerHTML = entries.map(o=>{
      const ch = channelMap[o.channel] || channelMap.etc;
      const st = statusOf(o);
      let shipHtml = "";
      if(st==="예정"){
        shipHtml = `<button class="ship-btn" data-ship="${o.id}">✓ 출고완료</button>`;
      } else if(st==="출고완료"){
        const t = o.shippedAt ? new Date(o.shippedAt) : null;
        shipHtml = `<div class="ship-info">✓ 출고완료${t?` · ${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`:""}</div>
                    <button class="ship-btn undo" data-unship="${o.id}">출고완료 취소</button>`;
      } else {
        shipHtml = `<div class="ship-info">✓ 판매입력완료 (수정하려면 공장장에게)</div>`;
      }
      const arr = o.arrivalDate ? `<div class="writer-tag">입고(납품)일 ${shortDate(o.arrivalDate)}${o.source==="po"?" · 쿠팡 PO 자동등록":""}</div>` : "";
      return `
        <div class="order-card">
          <div class="order-card-top">
            <span class="chip" style="background:${ch.color}">${escapeHtml(labelOf(o))}</span>
            <div class="order-actions">
              <button class="icon-btn" data-copy="${o.id}">⧉</button>
              <button class="icon-btn" data-edit="${o.id}">✎</button>
              <button class="icon-btn" data-del="${o.id}">🗑</button>
            </div>
          </div>
          <div class="items-list">${renderItems(o.items)}</div>
          ${arr}
          ${shipHtml}
        </div>
      `;
    }).join("");
  }

  body.innerHTML += `<button class="add-here-btn" id="addHereBtn">이 날짜에 발주 추가</button>`;

  body.querySelectorAll("[data-copy]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const entry = entries.find(o=>o.id===btn.dataset.copy);
      if(entry) copyItemsText(itemsToText(entry.items));
    });
  });

  body.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.addEventListener("click", ()=> openForm(dateStr, btn.dataset.edit));
  });
  body.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", ()=> confirmDelete(btn.dataset.del));
  });
  body.querySelectorAll("[data-ship]").forEach(btn=>{
    btn.addEventListener("click", ()=> setShipped(btn.dataset.ship, true));
  });
  body.querySelectorAll("[data-unship]").forEach(btn=>{
    btn.addEventListener("click", ()=> setShipped(btn.dataset.unship, false));
  });
  document.getElementById("addHereBtn").addEventListener("click", ()=> openForm(dateStr, null));

  showSheet("daySheet");
}

const RT_MARK = "<!--rt-->";
const RT_TAGS = {B:1,STRONG:1,I:1,U:1,SPAN:1,DIV:1,P:1,BR:1};
function cleanStyle(st){
  const out=[];
  (st||"").split(";").forEach(d=>{
    const k=d.indexOf(":"); if(k<0) return;
    const n=d.slice(0,k).trim().toLowerCase(), v=d.slice(k+1).trim().toLowerCase();
    if(n==="font-weight" && /^(bold|[4-9]00)$/.test(v)) out.push("font-weight:700");
    else if((n==="color"||n==="background-color") && /^(#[0-9a-f]{3,8}|transparent|rgba?\(\s*[\d.\s,]+\))$/.test(v)) out.push(n+":"+v);
    else if(n==="font-size" && /^[\d.]+(em|%)$/.test(v) && parseFloat(v)<=3) out.push("font-size:"+v);
  });
  return out.join(";");
}
function sanitizeNode(node, outParent){
  node.childNodes.forEach(c=>{
    if(c.nodeType===3){ outParent.appendChild(document.createTextNode(c.nodeValue)); }
    else if(c.nodeType===1){
      let tag=c.tagName;
      if(tag==="FONT"){ tag="SPAN"; }
      if(tag==="SCRIPT"||tag==="STYLE") return;
      if(!RT_TAGS[tag]){ sanitizeNode(c,outParent); return; }
      const el=document.createElement(tag.toLowerCase());
      if(tag!=="BR"){
        let st=cleanStyle(c.getAttribute("style"));
        if(c.tagName==="FONT" && c.getAttribute("color")) st+=(st?";":"")+cleanStyle("color:"+c.getAttribute("color"));
        if(st) el.setAttribute("style",st);
        sanitizeNode(c,el);
      }
      outParent.appendChild(el);
    }
  });
}
function sanitizeHtml(html){
  const doc=new DOMParser().parseFromString("<body>"+html.replace(RT_MARK,"")+"</body>","text/html");
  const box=document.createElement("div");
  sanitizeNode(doc.body, box);
  return box.innerHTML;
}
function richToText(html){
  const box=document.createElement("div"); box.innerHTML=sanitizeHtml(html);
  let out="";
  (function walk(n){
    n.childNodes.forEach(c=>{
      if(c.nodeType===3) out+=c.nodeValue;
      else if(c.tagName==="BR") out+="\n";
      else {
        const blk=(c.tagName==="DIV"||c.tagName==="P");
        if(blk && out && !out.endsWith("\n")) out+="\n";
        walk(c);
        if(blk && !out.endsWith("\n")) out+="\n";
      }
    });
  })(box);
  return out.replace(/ /g," ").replace(/\n+$/,"");
}
function isRich(str){ return typeof str==="string" && str.startsWith(RT_MARK); }
function itemsToText(str){ str=str||""; return isRich(str)? richToText(str) : str; }
function renderItems(str){
  str=str||"";
  const html = isRich(str) ? `<div class="rt">${sanitizeHtml(str)}</div>` : escapeHtml(str);
  // 바코드 끝 4자리 [0632] → 형광 표시 (배차도구 작업지시의 오출고 위험 상품, 2026-11-23)
  return html.replace(/\[(\d{4})\]/g, '<span class="bc-hl">[$1]</span>');
}
function initEditor(){
  const ed=document.getElementById("fEditor");
  const tb=document.getElementById("rtToolbar");
  tb.addEventListener("pointerdown", e=>{ if(e.target.closest("button")) e.preventDefault(); });
  tb.addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return;
    ed.focus();
    document.execCommand("styleWithCSS",false,true);
    if(b.dataset.cmd){ document.execCommand(b.dataset.cmd,false,null); }
    else if(b.dataset.color){ document.execCommand("foreColor",false,b.dataset.color); }
    else if(b.dataset.hl){
      document.execCommand("hiliteColor",false,b.dataset.hl);
      if(b.dataset.hl!=="transparent") document.execCommand("foreColor",false,"#111111");
    }
    else if(b.dataset.size){
      document.execCommand("fontSize",false,"7");
      const spans=[];
      ed.querySelectorAll("font[size='7'],span[style*='xxx-large']").forEach(f=>{
        const sp=document.createElement("span");
        sp.style.fontSize=b.dataset.size;
        while(f.firstChild) sp.appendChild(f.firstChild);
        f.replaceWith(sp);
        spans.push(sp);
      });
      if(spans.length){
        const r=document.createRange();
        r.setStartBefore(spans[0]); r.setEndAfter(spans[spans.length-1]);
        const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
      }
    }
  });
  ed.addEventListener("paste", e=>{
    e.preventDefault();
    const t=(e.clipboardData||window.clipboardData).getData("text/plain");
    document.execCommand("insertText",false,t);
  });
}
function setEditorContent(str){
  const ed=document.getElementById("fEditor");
  str=str||"";
  ed.innerHTML = isRich(str) ? sanitizeHtml(str) : escapeHtml(str).replace(/\n/g,"<br>");
}
function getEditorContent(){
  const ed=document.getElementById("fEditor");
  const html=sanitizeHtml(ed.innerHTML);
  const txt=richToText(html).trim();
  if(!txt) return "";
  return RT_MARK+html;
}
function escapeHtml(str){
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function copyItemsText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      showToast("복사되었습니다");
    }).catch(()=>{
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand("copy");
    showToast("복사되었습니다");
  }catch(e){
    showToast("복사에 실패했습니다");
  }
  document.body.removeChild(ta);
}

function openForm(dateStr, id){
  editingId = id;
  document.getElementById("formTitle").textContent = id ? "발주 수정" : "발주 추가";
  document.getElementById("fDate").value = dateStr || todayStr;
  document.getElementById("deleteBtn").style.display = id ? "block" : "none";

  let isPo = false;
  document.getElementById("fArrival").value = "";
  if(id){
    const entry = (ordersByDate[dateStr]||[]).find(o=>o.id===id);
    if(entry){
      selectedChannel = entry.channel;
      setEditorContent(entry.items);
      document.getElementById("fArrival").value = entry.arrivalDate || "";
      isPo = entry.source === "po";
    }
  } else {
    selectedChannel = selectedChannel || CHANNELS[0].id;
    setEditorContent("");
  }
  editingIsPo = isPo;
  document.getElementById("fEditor").contentEditable = isPo ? "false" : "true";
  document.getElementById("fEditor").style.background = isPo ? "#f3f5f5" : "#fff";
  document.getElementById("rtToolbar").style.display = isPo ? "none" : "flex";
  document.getElementById("poNote").style.display = isPo ? "block" : "none";
  document.getElementById("channelGrid").style.pointerEvents = isPo ? "none" : "";
  document.getElementById("channelGrid").style.opacity = isPo ? ".5" : "";
  renderChannelGrid();
  hideSheet("daySheet");
  showSheet("formSheet");
}

function saveOrder(){
  if(DEMO_MODE){ showToast("데모 모드입니다 — Firebase 연결 후 저장 가능"); return; }
  const dateStr = document.getElementById("fDate").value;
  const items = getEditorContent();
  const writer = "김현우";

  if(!dateStr){ showToast("날짜를 선택해 주세요"); return; }
  if(!items){ showToast("품목을 입력해 주세요"); return; }

  const arrival = document.getElementById("fArrival").value || "";

  // 쿠팡 PO 자동등록 건은 날짜만 수정 (품목·수량은 쿠팡도구에서 PO로 관리)
  const payload = editingIsPo
    ? { date: dateStr, arrivalDate: arrival, updatedAt: Date.now() }
    : { date: dateStr, arrivalDate: arrival, channel: selectedChannel, items, writer, updatedAt: Date.now() };
  if(!editingId) payload.status = "예정";

  const action = editingId
    ? db.collection(COLLECTION).doc(editingId).update(payload)
    : db.collection(COLLECTION).add(payload);

  action.then(()=>{
    showToast(editingId ? "발주가 수정되었습니다" : "발주가 저장되었습니다");
    hideSheet("formSheet");
    editingId = null;
  }).catch(err=>{
    console.error(err);
    showToast("저장 실패 — 연결을 확인해 주세요");
  });
}

function findEntry(id){
  for(const list of Object.values(ordersByDate)){ const e = list.find(o=>o.id===id); if(e) return e; }
  return null;
}

/* 출고완료 표시 / 취소 (현장에서 누름) */
function setShipped(id, done){
  if(DEMO_MODE){ showToast("데모 모드입니다 — Firebase 연결 후 가능"); return; }
  const e = findEntry(id);
  if(e && statusOf(e)==="판매입력완료"){ showToast("판매입력이 끝난 건은 바꿀 수 없습니다"); return; }
  if(!done && !confirm("출고완료를 취소할까요?")) return;
  const payload = done ? { status:"출고완료", shippedAt: Date.now() } : { status:"예정", shippedAt: null };
  db.collection(COLLECTION).doc(id).update(payload).then(()=>{
    showToast(done ? "출고완료로 표시했습니다" : "출고완료를 취소했습니다");
  }).catch(err=>{ console.error(err); showToast("저장 실패 — 연결을 확인해 주세요"); });
}

function confirmDelete(id){
  if(DEMO_MODE){ showToast("데모 모드입니다 — Firebase 연결 후 삭제 가능"); return; }
  const e = findEntry(id);
  const warn = e && e.source==="po" ? "쿠팡 PO 자동등록 건입니다.\n삭제하면 배차표·판매입력에서도 빠집니다.\n\n" : "";
  if(confirm(warn + "이 발주를 삭제할까요?")){
    db.collection(COLLECTION).doc(id).delete().then(()=>{
      showToast("삭제되었습니다");
    });
  }
}

/* =========================================================
   10) Sheet helpers
========================================================= */
function showSheet(id){
  document.getElementById("overlay").classList.add("show");
  document.getElementById(id).classList.add("show");
}
function hideSheet(id){
  document.getElementById(id).classList.remove("show");
  const anyOpen = document.querySelectorAll(".sheet.show").length>0;
  if(!anyOpen) document.getElementById("overlay").classList.remove("show");
}
function hideAllSheets(){
  document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("show"));
  document.getElementById("overlay").classList.remove("show");
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 2200);
}

/* =========================================================
   엑셀 다운로드
========================================================= */
function openExcelSheet(){
  const start = addDays(centerDate, RANGE_START_OFFSET);
  const end = addDays(centerDate, RANGE_END_OFFSET);
  document.getElementById("excelStart").value = toDateStr(start);
  document.getElementById("excelEnd").value = toDateStr(end);
  showSheet("excelSheet");
}

function exportToExcel(){
  const startStr = document.getElementById("excelStart").value;
  const endStr = document.getElementById("excelEnd").value;

  if(!startStr || !endStr){
    showToast("시작일과 종료일을 선택해 주세요");
    return;
  }
  if(startStr > endStr){
    showToast("시작일이 종료일보다 늦을 수 없습니다");
    return;
  }

  const weekdayNames = ["일","월","화","수","목","금","토"];
  const dates = Object.keys(ordersByDate)
    .filter(d => d >= startStr && d <= endStr)
    .sort();

  if(dates.length===0){
    showToast("해당 기간에 발주 내역이 없습니다");
    return;
  }

  const rows = [["출고일","요일","채널","입고(납품)일","상태","품목 / 수량"]];
  dates.forEach(dateStr=>{
    const d = new Date(dateStr);
    const wd = weekdayNames[d.getDay()];
    (ordersByDate[dateStr]||[]).forEach(o=>{
      rows.push([dateStr, wd, labelOf(o), o.arrivalDate || "", statusOf(o), itemsToText(o.items)]);
    });
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{wch:12},{wch:6},{wch:16},{wch:12},{wch:12},{wch:60}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "발주내역");

  XLSX.writeFile(wb, `위드프레쉬_발주내역_${startStr}_${endStr}.xlsx`);
  hideSheet("excelSheet");
}
